<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e1c">
<title>深夜平交道的拼圖戀曲～在都市傳說中尋找妳的另一半～</title>
<style>
:root {
  color-scheme:dark;
  --ink:#120f19;
  --paper:#fbf2f3;
  --muted:#bcb1c2;
  --accent:#ffc0c8;
  --border:#534457;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
* { box-sizing:border-box }
[hidden] { display:none!important }
body { margin:0;min-height:100svh;display:grid;place-items:center;padding:20px 16px;background:var(--ink);color:var(--paper);font-family:system-ui,"Microsoft JhengHei",sans-serif }
button { font:inherit;color:inherit;cursor:pointer }
button:focus-visible { outline:2px solid var(--accent);outline-offset:4px }
button:disabled { opacity:.55;cursor:default }
.shell { width:min(1100px,100%) }
.chrome { display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;color:var(--muted);font-size:13px;letter-spacing:.08em }
.sound,.tools button,.panel button,.ending-screen button { border:1px solid var(--border);border-radius:6px;background:#241d2e;padding:9px 13px;min-height:40px }
.sound:hover,.tools button:hover,.panel button:hover:not(:disabled),.ending-screen button:hover { border-color:var(--accent) }
.book { display:grid;min-height:440px;aspect-ratio:16/9;border:1px solid var(--border);border-radius:12px;background:#1d1725 }
.title-screen,.ending-screen { display:grid;place-items:center;padding:clamp(24px,5vw,60px);text-align:center }
.title-content { width:min(100%,660px) }
.eyebrow,.chapter,.end-kicker { color:var(--accent);font-size:13px;letter-spacing:.13em }
.eyebrow { margin-bottom:16px;font-variant:small-caps }
h1 { margin:0;font:800 clamp(32px,6.2vw,72px)/1.13 var(--serif);letter-spacing:.04em }
h1 span { display:block;color:var(--accent) }
.subtitle { margin:18px 0 28px;color:#ecdae8;font:600 clamp(14px,2.2vw,21px)/1.55 var(--serif) }
.menu { display:grid;gap:8px;width:min(100%,330px);margin:auto }
.menu button,.choices button { min-height:46px;border:1px solid var(--border);border-radius:6px;background:#2b2234;text-align:left }
.menu button { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px }
.menu small { color:var(--muted);font-size:12px }
.menu button:hover,.choices button:hover:not(:disabled) { border-color:var(--accent);background:#423047 }
.menu .primary,.end-actions button:last-child { background:var(--accent);border-color:var(--accent);color:#29192d;font-weight:750 }
.menu .primary:hover,.end-actions button:last-child:hover { background:#ffdae0 }
.game-screen { display:flex;flex-direction:column;padding:clamp(14px,3vw,34px) }
.gamebar,.toolgroup,.tools { display:flex;flex-wrap:wrap;align-items:center;gap:7px }
.gamebar { justify-content:space-between;row-gap:11px }
.chapter { margin:0;font-weight:700 }
.tools button { padding-inline:9px;font-size:13px }
.tools button[aria-pressed="true"] { border-color:var(--accent);background:#543650 }
.reading { display:grid;align-content:center;flex:1;gap:16px;width:min(100%,730px);margin:auto;padding:24px 0 }
.dialogue { position:relative;display:block;width:100%;min-height:185px;border:1px solid var(--border);border-radius:8px;background:#241d2e;text-align:left;padding:20px 22px 52px;line-height:1.8 }
.dialogue:hover:not(:disabled) { border-color:var(--accent) }
.dialogue:disabled { opacity:1 }
.speaker { display:block;margin-bottom:10px;color:var(--accent);font-weight:750;font-size:15px;letter-spacing:.08em }
.line { display:block;min-height:3.6em;white-space:pre-line;font-size:clamp(17px,2.2vw,24px) }
.next { position:absolute;right:20px;bottom:12px;color:var(--muted);font-size:13px;animation:blink 1s ease-in-out infinite alternate }
.choices { display:grid;gap:8px }
.choices button { padding:10px 13px;line-height:1.5 }
.endcard { width:min(100%,620px) }
.endcard h2,.panel h2 { margin:.5em 0;font:800 clamp(24px,4vw,46px)/1.25 var(--serif) }
.end-actions { display:flex;flex-wrap:wrap;justify-content:center;gap:9px }
.ending-screen.is-success {
  border-radius:inherit;
  background:radial-gradient(ellipse at top,#53343d 0%,#2e2237 55%,#1d1725 100%);
}
.is-success .endcard {
  padding:clamp(20px,5vw,48px);
  border:1px solid #ad825d;
  border-radius:12px;
  background:#221827;
  box-shadow:0 0 32px #e8aa7740,inset 0 0 0 4px #d4a26b25;
}
.is-success .end-kicker { color:#e7c7a7 }
.end-player-title {
  margin:0 0 12px;
  color:var(--accent);
  font:750 clamp(22px,4vw,32px)/1.4 var(--serif);
  letter-spacing:.12em;
}
.is-success .end-player-title { color:#ffdda7 }
.is-success .endcard h2 { color:#fff1d6 }
.is-success .end-actions button:last-child { background:#ffdda7;border-color:#ffdda7 }
.is-success .end-actions button:last-child:hover { background:#fff1d6 }
.book:has(.ending-screen.is-success:not([hidden])) { border-color:#ad825d }
dialog { padding:0;color:var(--paper);width:min(570px,calc(100% - 30px));max-height:85svh;background:#251c34;border:1px solid var(--border);border-radius:8px }
dialog::backdrop { background:#0b0818bb }
.panel { padding:20px }
.panel-head { display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px }
.panel h2 { font-size:26px;margin:0 }
.entries { display:grid;gap:8px }
.entries button { text-align:left }
.entries small { display:block;color:var(--muted);margin-top:4px }
.entries .locked { padding:10px 13px;border:1px solid var(--border);border-radius:6px;color:var(--muted) }
.entries p { margin:0;padding:8px 0;border-bottom:1px solid var(--border);line-height:1.6 }
.entries p strong { display:block;color:var(--accent);font-size:13px }
.panel-nav { margin-top:13px }
.toast { position:fixed;z-index:8;left:50%;bottom:18px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);border:1px solid var(--border);background:#31233d;padding:9px 14px;border-radius:6px;text-align:center;font-size:14px }
@keyframes blink { to { opacity:.5 } }
@media(max-width:650px) {
  .book { aspect-ratio:auto;min-height:min(590px,calc(100svh - 96px)) }
  .chapter { width:100% }
  .dialogue { padding:16px 14px 44px }
  .sound,.tools button,.panel button,.ending-screen button { min-height:44px }
  .tools { gap:4px }
  .tools button { padding-inline:7px }
}
@media(prefers-reduced-motion:reduce) { .next { animation:none } }
</style>
</head>
<body>
<main class="shell">
  <header class="chrome top">
    <span>怪談研究社</span>
    <button class="sound" id="sound" type="button"></button>
  </header>
  <div class="book">
    <section id="titleScreen" class="title-screen" aria-labelledby="title">
      <div class="title-content">
        <div class="eyebrow">MIDNIGHT CROSSING</div>
        <h1 id="title">深夜平交道的<span>拼圖戀曲</span></h1>
        <p class="subtitle">～在都市傳說中尋找妳的另一半～</p>
        <nav class="menu" aria-label="主選單">
          <button class="primary" id="start" type="button"><strong>開始遊戲</strong><small>NEW GAME</small></button>
          <button id="continue" type="button"><strong>讀取進度</strong><small>LOAD</small></button>
          <button id="gallery" type="button"><strong>結局圖鑑</strong><small id="galleryCount"></small></button>
        </nav>
      </div>
    </section>
    <section id="gameScreen" class="game-screen" aria-label="遊戲畫面" hidden>
      <div class="gamebar"><h2 class="chapter" id="chapter"></h2><div class="toolgroup"><div class="tools" aria-label="遊戲工具">
        <button data-panel="save">存檔</button><button data-panel="load">讀檔</button><button data-panel="log">歷史對話</button><button id="auto" aria-pressed="false">自動播放</button><button id="skip" aria-pressed="false">跳過</button>
      </div></div></div>
      <div class="reading">
        <button class="dialogue" id="dialogue" type="button"><span class="speaker" id="speaker"></span><span class="line" id="line"></span><span class="next" id="next" aria-hidden="true">繼續 ↵</span></button>
        <div class="choices" id="choices" aria-label="劇情選項" hidden></div>
      </div>
    </section>
    <section class="ending-screen" id="endingScreen" aria-labelledby="endPlayerTitle endTitle" hidden>
      <article class="endcard">
        <p class="end-player-title" id="endPlayerTitle" hidden></p>
        <div class="end-kicker" id="endNumber"></div>
        <h2 id="endTitle"></h2>
        <div class="end-actions"><button id="backChoice">回到最後選項</button><button id="endHome">返回標題</button></div>
      </article>
    </section>
  </div>
</main>
<dialog id="modal" aria-labelledby="panelTitle"><div class="panel"><div class="panel-head"><h2 id="panelTitle"></h2><button id="closePanel" aria-label="關閉">✕</button></div><div id="entries" class="entries"></div><div id="panelNav" class="panel-nav" hidden><button id="gameHome">返回標題</button></div></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const R="白川 凜", H="花子", S="淺井 悠真", M="八尺學姊", L="賣腳婆婆", K="裂口女", T="高速婆婆", N="旁白";
const line = (who,text,fx) => ({who,text,fx});
const choice = (text,to,delta={}) => ({text,to,delta});
const scene = (label,lines,next=null,picks=null,ending=null) => ({label,lines,next,picks,ending});
const festivalLabel = "7月31日 煙火大會之夜";
const scenes = {
  intro: scene("序章｜7月18日 23:30｜深夜平交道",[
    line(N,"晚上十一點半，暑假還有半小時才正式開始。我站在平交道前，聽警鈴把短短的歸途敲成一趟遠足。","bell"),
    line(S,"淺井悠真，都市傳說研究社社長。今晚的調查成果是一罐沒拉環的汽水，和一台還有四成電的 Nintendo Switch。"),
    line("平交道","カン、カン、カン……"),
    line("？？？","テケ、テケ、テケ……","thud"),
    line(N,"紅光一閃，一個穿水手服的女孩用雙手撐地，沿著柏油路衝過來。那速度大概有一百五十公里。"),
    line("？？？","讓、讓開！我只練過直線煞車！"),
    line(S,"妳往我這裡滑的路線倒是挺直的！"),

  ],null,[
    choice("「滾、滾回地獄去啊——！」","badRun"),
    choice("「同學，大晚上的在柏油路上爬會磨破制服，要不要搭我的便車？」","pact",{rin:15})
  ]),
  badRun: scene("序章｜7月18日 23:30｜深夜平交道",[
    line(N,"我對自己俐落的九十度轉彎十分滿意，直到發現女孩已經在轉角等我。"),
    line(R,"你掉了東西。","thud"),
    line(N,"她舉起我的學生證。那張照片還留著我對自己腿力的信心。"),

    line(R,"便、便車？你騎的是有菜籃的那輛？"),

    line(R,"那我買兩顆。你推車的時候不能吃，回去再分。"),
    line(N,"我去解車鎖。身後傳來很輕的一聲笑，像有人終於確定可以回家了。")

  day3: scene("Day 3｜7月24日 黃昏｜田間小路",[
    line(N,"為了找祭典的煙火觀賞點，我們四個沿著田埂走。學姊收起白帽，免得替整片稻田遮陽。"),

    line(R,"等等。那個白色的東西……剛才的風已經停了。"),
    line(N,"稻浪靜下來，田裡卻有一道白影，一節一節地折動，彷彿聽著我們聽不到的拍子。","thud"),

    line(H,"社長的專長就是別人說別看，他偏要回頭確認一下。"),

    choice("「大家快移開視線！看我用 Switch 的《Just Dance》節拍把它的頻率蓋過去！」","dance",{rin:10,hanako:10,hachishaku:10})

  badDance: scene("Day 3｜7月24日 黃昏｜失控的田埂",[

    line(H,"悠真，聽我的聲音。我在這裡，往我這邊走。"),

  dance: scene("Day 3｜7月24日 黃昏｜稻浪舞池",[

function addDay(id, date, lines, next, visits) {
  const invitations = [];
  for (const [heroine, visit] of Object.entries(visits)) {
    const eventId = id + "_" + heroine;
    const label = date + "｜" + visit.place;
    invitations.push(choice(visit.invite,eventId));
    const replies = visit.replies.map(([spoken, points, reaction],i) => {
      const reactionId = eventId + "_" + i;
      scenes[reactionId] = scene(label,reaction,next);
      return choice(spoken,reactionId,{[heroine]:points});
    });
    scenes[eventId] = scene(label,visit.lines,null,replies);
  }
  scenes[id] = scene(date,lines,null,invitations);
}

addDay("day1","Day 1｜7月20日 午休",[
  line(N,"七月二十日，暑輔鐘聲一響，我把便當從課本底下抽出來。蓋子上多了三張字條。"),

],"day2",{

    replies:[
      ["「妳先扶穩。我餵妳吃一口玉子燒，好嗎？」",15,[
        line(R,"你可以轉過去一點嗎？我張嘴的樣子很好笑。"),
        line(S,"好。我只看雲。雲今天很忙，沒有空作證。"),
        line(N,"筷尖忽然一輕。她咀嚼完，把另一雙筷子推到我掌心。"),

      ]],
      ["「我下次拿膠帶把妳黏在輪椅上好了，這樣就能保持平衡了吧？」",-15,[
        line(R,"我拿得穩。你扶一下盒子就好。"),
        line(N,"她重新攤好餐巾，把便當挪回自己膝上。後來我拿筷子時，她先把手收了回去。"),

  hanako:{

    invite:"「花子，我分妳一個飯糰。今天能借我第三間旁邊的窗台嗎？」",
    lines:[
      line(N,"我敲了三下。第三間的門沒開，窗台上卻多了一個穿舊式制服的雙馬尾女孩。"),
      line(H,"飯糰放左邊。右邊是我國二時的座位，由窗邊的瓷磚替我保留。"),

    lines:[
      line(N,"白帽放在銀杏樹根上，遠看像一桌還沒掀蓋的點心。學姊用竹葉折了兩個筷架。"),

};
function persist() {
  try {
    localStorage.setItem(SAVE_KEY,JSON.stringify({...profile,unlocked:[...profile.unlocked]}));
    return true;
  } catch {
    storageAvailable=false;
    return false;
  }
}

let audio, output;
function wakeAudio() {
  if (profile.muted) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!audio && AudioContext) {
      audio=new AudioContext();
      output=audio.createGain();
      output.connect(audio.destination);
    }
    if (audio?.state==="suspended") audio.resume().catch(()=>{});
  } catch { /* Audio is optional on browsers without a usable audio output. */ }
}
function tone(frequency, offset, duration, volume, type="sine", endFrequency=frequency) {
  if (!output || audio.state==="closed") return;
  const start=audio.currentTime+offset+.008;
  const oscillator=audio.createOscillator();
  const envelope=audio.createGain();
  oscillator.type=type;
  oscillator.frequency.setValueAtTime(frequency,start);
  oscillator.frequency.exponentialRampToValueAtTime(endFrequency,start+duration);
  envelope.gain.setValueAtTime(.0001,start);
  envelope.gain.exponentialRampToValueAtTime(volume,start+.009);
  envelope.gain.exponentialRampToValueAtTime(.0001,start+duration);
  oscillator.connect(envelope).connect(output);
  oscillator.start(start);
  oscillator.stop(start+duration+.012);
}
const effects = {
  bell:()=>[0,.33,.66].forEach(t=>{tone(1046,t,.19,.085,"triangle",1024);tone(1600,t,.13,.035,"sine",1540);}),
  blip:()=>tone(470,0,.035,.032,"triangle",410),
  chime:()=>[523,660,784].forEach((frequency,i)=>tone(frequency,i*.075,.20,.065,"triangle")),
  thud:()=>[0,.16,.61,.77].forEach(t=>tone(90,t,.155,.15,"sine",38)),
  victory:()=>[523,659,784,1047,988,1047].forEach((frequency,i)=>tone(frequency,i*.155,i===5?.52:.24,.083,"triangle"))
};
function sound(name) { if (!profile.muted && audio && effects[name]) effects[name](); }
function renderSound() {
  $("sound").textContent=(profile.muted?"音效關閉":"音效開啟");
  $("sound").setAttribute("aria-pressed",String(!profile.muted));
  $("sound").setAttribute("aria-label",profile.muted?"取消靜音":"靜音");
}
$("sound").addEventListener("click",()=>{
  profile.muted=!profile.muted;
  if (output) output.gain.setValueAtTime(profile.muted?0:1,audio.currentTime);
  if (!profile.muted) { wakeAudio(); sound("chime"); }
  persist();
  renderSound();
});
document.addEventListener("pointerdown",event=>{ if (event.isTrusted && !$("sound").contains(event.target)) wakeAudio(); });

const modal=$("modal");
let mode="title", state, playback="manual", typing, advanceTimer, toastTimer;
const heroines = ["rin","hanako","hachishaku"];
const freshState = () => ({id:"intro",index:0,affection:{rin:0,hanako:0,hachishaku:0},choosing:false,history:[],lastChoice:null});
function festivalRoute({affection}) {
  let lead = null;
  // Ties follow the order of the heroines' invitations.
  for (const heroine of heroines) {
    if (affection[heroine]>=45 && (lead===null || affection[heroine]>affection[lead])) lead=heroine;
  }
  return {rin:"rinFestival",hanako:"hanakoFestival",hachishaku:"hachiFestival"}[lead] ?? "common";
}
const endNumber = end => `END ${String(end.num).padStart(2,"0")}/${Object.keys(endings).length} · ${end.type}`;
function announce(text) {
  clearTimeout(toastTimer);
  $("toast").textContent=text;
  $("toast").hidden=false;
  toastTimer=setTimeout(()=>{ $("toast").hidden=true; },2900);
}
function setMode(nextMode) {
  mode=nextMode;
  $("titleScreen").hidden=nextMode!=="title";
  $("gameScreen").hidden=nextMode!=="game";
  $("endingScreen").hidden=nextMode!=="ending";
}
function stopTimers() {
  clearTimeout(advanceTimer);
  if (typing) clearTimeout(typing.timer);
}
function setPlayback(nextMode) {
  playback=nextMode;
  $("auto").setAttribute("aria-pressed",String(playback==="auto"));
  $("skip").setAttribute("aria-pressed",String(playback==="skip"));
}
function updateGalleryCount() { $("galleryCount").textContent=`${profile.unlocked.size} / ${Object.keys(endings).length}`; }
function titleScreen() {
  stopTimers();
  clearTimeout(toastTimer);
  $("toast").hidden=true;
  typing=null;
  setPlayback("manual");
  setMode("title");
  updateGalleryCount();
  if (state) $("start").focus({preventScroll:true});
}
function currentLine() { return scenes[state.id].lines[state.index]; }
function drawLocation() {
  $("chapter").textContent=scenes[state.id].label;
}
function scheduleAdvance() {
  clearTimeout(advanceTimer);
  if (mode!=="game" || modal.open || state.choosing || typing || playback==="manual") return;
  const delay=playback==="skip"?95:Math.max(3400,Array.from(currentLine().text).length*72+1800);
  advanceTimer=setTimeout(advance,delay);
}
function completeLine() {
  if (typing) clearTimeout(typing.timer);
  typing=null;
  $("line").textContent=currentLine().text;
  $("next").hidden=state.choosing;
  scheduleAdvance();
}
function typeCharacter() {
  if (!typing || modal.open) return;
  typing.position++;
  $("line").textContent=typing.characters.slice(0,typing.position).join("");
  if (typing.position>=typing.characters.length) { completeLine(); return; }
  if (typing.position%5===1) sound("blip");
  const char=typing.characters[typing.position-1];
  typing.timer=setTimeout(typeCharacter,/[。！？…]/.test(char)?100:32);
}
function drawChoices(focus) {
  $("choices").replaceChildren();
  $("choices").hidden=!state.choosing;
  $("dialogue").disabled=state.choosing;
  if (!state.choosing) return;
  setPlayback("manual");
  scenes[state.id].picks.forEach(pick=>{
    const button=document.createElement("button");
    button.textContent=pick.text;
    button.addEventListener("click",()=>pickChoice(pick));
    $("choices").append(button);
  });
  if (focus) $("choices").querySelector("button")?.focus({preventScroll:true});
}
function renderLine({animate=true,playFx=true,focus=false}={}) {
  stopTimers();
  typing=null;
  drawLocation();
  drawChoices(focus && state.choosing);
  $("speaker").textContent=currentLine().who;
  $("dialogue").setAttribute("aria-label",state.choosing?"請選擇劇情選項":`${currentLine().who}：${currentLine().text}，繼續對話`);
  if (playFx && playback!=="skip") sound(currentLine().fx);
  if (!animate || state.choosing || playback==="skip" || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    completeLine();
  } else {
    $("next").hidden=true;
    typing={characters:Array.from(currentLine().text),position:0,timer:null};
    typeCharacter();
  }
  if (focus && !state.choosing) $("dialogue").focus({preventScroll:true});
}
function recordLine() {
  const {who,text}=currentLine();
  state.history.push({who,text});
}
function enterScene(id,focus=false) {
  Object.assign(state,{id,index:0,choosing:false});
  recordLine();
  renderLine({focus});
}
function startGame() {
  wakeAudio();
  setPlayback("manual");
  state=freshState();
  setMode("game");
  enterScene("intro",true);
}
function advance() {
  if (mode!=="game" || modal.open || state.choosing) return;
  if (typing) { completeLine(); return; }
  const currentScene=scenes[state.id];
  if (state.index+1<currentScene.lines.length) {
    state.index++;
    recordLine();
    renderLine();
  } else if (currentScene.picks) {
    state.choosing=true;
    renderLine({animate:false,playFx:false,focus:true});
  } else if (currentScene.next) {
    const next=typeof currentScene.next==="function" ? currentScene.next(state) : currentScene.next;
    enterScene(next);
  } else {
    showEnding(currentScene.ending);
  }
}
function pickChoice(pick) {
  if (!state.choosing) return;
  wakeAudio();
  sound("chime");
  const {id,index,affection,history}=state;
  state.lastChoice={id,index,affection:{...affection},historyLength:history.length};
  for (const [heroine,points] of Object.entries(pick.delta)) affection[heroine]+=points;
  history.push({who:S,text:pick.text});
  enterScene(pick.to,true);
}
function showEnding(id) {
  stopTimers();
  setPlayback("manual");
  const end=endings[id];
  profile.unlocked.add(id);
  if (!persist()) announce("此瀏覽器目前無法寫入本機儲存。結局已記錄於本次遊戲。");
  setMode("ending");
  $("endingScreen").classList.toggle("is-success",Boolean(end.success));
  $("endPlayerTitle").hidden=!end.playerTitle;
  $("endPlayerTitle").textContent=end.playerTitle ?? "";
  $("endNumber").textContent=endNumber(end);
  $("endTitle").textContent=end.title;
  $("backChoice").hidden=!state.lastChoice;
  (state.lastChoice?$("backChoice"):$("endHome")).focus({preventScroll:true});
}
function rewindChoice() {
  const checkpoint=state.lastChoice;
  if (!checkpoint) return;
  state={id:checkpoint.id,index:checkpoint.index,affection:{...checkpoint.affection},choosing:true,history:state.history.slice(0,checkpoint.historyLength),lastChoice:checkpoint};
  setMode("game");
  renderLine({animate:false,playFx:false,focus:true});
}
function togglePlayback(nextMode) {
  setPlayback(playback===nextMode?"manual":nextMode);
  if (state.choosing && playback!=="manual") {
    setPlayback("manual");
    announce("請先選擇劇情選項");
    return;
  }
  if (playback==="skip" && typing) completeLine();
  else scheduleAdvance();
}

function createEntry(title,detail,action) {
  const element=document.createElement(action?"button":"div");
  if (!action) element.className="locked";
  element.textContent=title;
  if (detail) {
    const small=document.createElement("small");
    small.textContent=detail;
    element.append(small);
  }
  if (action) element.addEventListener("click",action);
  $("entries").append(element);
}
function validPosition(position) {
  if (!position || !Object.hasOwn(scenes,position.id)) return false;
  return Number.isInteger(position.index) && position.index>=0 && position.index<scenes[position.id].lines.length &&
    position.affection && heroines.every(heroine=>Number.isInteger(position.affection[heroine]));
}
function validSave(slot) {
  return validPosition(slot?.progress) && Array.isArray(slot.progress.history);
}
function saveSlot(index) {
  profile.slots[index]={progress:JSON.parse(JSON.stringify(state)),unlocked:[...profile.unlocked],time:new Date().toISOString()};
  if (persist()) announce(`已儲存至欄位 ${index+1}`);
  else announce("無法寫入本機儲存。這個存檔可在本次遊戲中使用。");
  renderPanel("save");
  $("entries").children[index].focus();
}
function loadSlot(index) {
  const slot=profile.slots[index];
  if (!validSave(slot)) return;
  state=JSON.parse(JSON.stringify(slot.progress));
  if (!validPosition(state.lastChoice) || !scenes[state.lastChoice.id].picks) state.lastChoice=null;
  state.choosing=Boolean(state.choosing && scenes[state.id].picks);
  if (Array.isArray(slot.unlocked)) slot.unlocked.forEach(id=>{ if (Object.hasOwn(endings,id)) profile.unlocked.add(id); });
  persist();
  stopTimers();
  setPlayback("manual");
  modal.close();
  setMode("game");
  renderLine({animate:false,playFx:false,focus:true});
  announce(`已讀取欄位 ${index+1}`);
}
function renderPanel(panel) {
  $("panelTitle").textContent={save:"存檔",load:"讀取進度",log:"歷史對話",gallery:"結局圖鑑"}[panel];
  $("entries").replaceChildren();
  $("panelNav").hidden=mode!=="game" || panel!=="log";
  if (panel==="save" || panel==="load") {
    profile.slots.forEach((slot,i)=>{
      const filled=validSave(slot);
      const detail=filled?`${scenes[slot.progress.id].label} · ${new Date(slot.time).toLocaleString("zh-TW",{hour12:false})}`:"空白欄位";
      createEntry(`欄位 0${i+1}`,detail,panel==="save"?()=>saveSlot(i):filled?()=>loadSlot(i):null);
    });
    if (!storageAvailable) createEntry("目前僅能在本次遊戲中使用存檔");
  } else if (panel==="gallery") {
    Object.entries(endings).forEach(([id,end])=>{
      if (profile.unlocked.has(id)) createEntry(`${endNumber(end)} · ${end.title}`,end.playerTitle);
      else createEntry(`END ${String(end.num).padStart(2,"0")}/${Object.keys(endings).length} · 未解鎖`);
    });
  } else {
    const fragment=document.createDocumentFragment();
    state.history.forEach(({who,text})=>{
      const paragraph=document.createElement("p");
      const name=document.createElement("strong");
      name.textContent=who;
      paragraph.append(name,text);
      fragment.append(paragraph);
    });
    $("entries").append(fragment);
  }
}
function openPanel(panel) {
  stopTimers();
  renderPanel(panel);
  modal.showModal();
  modal.scrollTop=panel==="log"?modal.scrollHeight:0;
}
modal.addEventListener("close",()=>{
  if (mode!=="game" || modal.open) return;
  if (typing) {
    clearTimeout(typing.timer);
    typing.timer=setTimeout(typeCharacter,32);
  } else scheduleAdvance();
});
modal.addEventListener("click",event=>{ if (event.target===modal) modal.close(); });
$("closePanel").addEventListener("click",()=>modal.close());
$("gameHome").addEventListener("click",()=>{ modal.close(); titleScreen(); });
$("start").addEventListener("click",startGame);
$("continue").addEventListener("click",()=>openPanel("load"));
$("gallery").addEventListener("click",()=>openPanel("gallery"));
$("dialogue").addEventListener("click",advance);
$("auto").addEventListener("click",()=>togglePlayback("auto"));
$("skip").addEventListener("click",()=>togglePlayback("skip"));
$("endHome").addEventListener("click",titleScreen);
$("backChoice").addEventListener("click",rewindChoice);
document.querySelectorAll("[data-panel]").forEach(button=>button.addEventListener("click",()=>openPanel(button.dataset.panel)));
document.addEventListener("keydown",event=>{
  if (mode!=="game" || modal.open || ["BUTTON","INPUT"].includes(event.target.tagName)) return;
  if (event.code==="Space" || event.code==="Enter") { event.preventDefault(); advance(); }
});
renderSound();
titleScreen();
</script>
</body>
</html>
